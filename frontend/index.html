<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 中古世紀村莊</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1a1a2e;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    #game-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    
    #game-canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 6;
    }
    
    #ui-layer > * {
      pointer-events: auto;
    }
    
    /* 動作選單樣式 */
    .action-menu {
      position: absolute;
      background: #2a2a4a;
      border: 2px solid #6a6a8a;
      border-radius: 4px;
      min-width: 150px;
      display: none;
      z-index: 100;
    }
    
    .action-menu-title {
      padding: 8px 12px;
      background: #3a3a5a;
      color: #ffd700;
      font-size: 14px;
      border-bottom: 1px solid #6a6a8a;
    }
    
    .action-menu-item {
      padding: 8px 12px;
      color: #e0e0e0;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.2s;
    }
    
    .action-menu-item:hover {
      background: #4a4a6a;
      color: #fff;
    }
    
    .action-menu-item.disabled {
      color: #666;
      cursor: not-allowed;
    }
    
    /* 狀態列 */
    #status-bar {
      position: absolute;
      bottom: 10px;
      left: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px;
      border-radius: 4px;
      color: #fff;
      font-size: 12px;
      display: flex;
      gap: 20px;
    }
    
    .stat-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    
    .stat-bar {
      width: 60px;
      height: 8px;
      background: #333;
      border-radius: 4px;
      overflow: hidden;
    }
    
    .stat-fill {
      height: 100%;
      transition: width 0.3s;
    }
    
    .stat-fill.energy { background: #4CAF50; }
    .stat-fill.hunger { background: #FF9800; }
    .stat-fill.social { background: #2196F3; }
    .stat-fill.happiness { background: #E91E63; }
    
    /* 時間顯示 */
    #time-display {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.7);
      padding: 8px 12px;
      border-radius: 4px;
      color: #ffd700;
      font-size: 14px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    #weather-icon {
      font-size: 18px;
    }
    
    /* 天氣特效層 */
    #weather-effects {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 5;
    }
    
    /* 雨滴 */
    .raindrop {
      position: absolute;
      width: 2px;
      background: linear-gradient(to bottom, transparent, rgba(174, 194, 224, 0.8));
      animation: rain-fall linear infinite;
    }
    @keyframes rain-fall {
      0% { transform: translateY(-100px); }
      100% { transform: translateY(100vh); }
    }
    
    /* 閃電 */
    .lightning {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.9);
      opacity: 0;
      pointer-events: none;
    }
    .lightning.flash {
      animation: lightning-flash 0.1s ease-out;
    }
    @keyframes lightning-flash {
      0% { opacity: var(--flash-opacity, 0.5); }
      100% { opacity: 0; }
    }
    
    /* 天氣遮罩（調暗畫面）*/
    #weather-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0);
      pointer-events: none;
      transition: background 2s ease;
      z-index: 4;
    }
    
    /* 對話框 */
    #dialog-box {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      max-width: 500px;
      background: rgba(20, 20, 40, 0.95);
      border: 2px solid #6a6a8a;
      border-radius: 8px;
      padding: 15px;
      display: none;
    }
    
    #dialog-speaker {
      color: #ffd700;
      font-weight: bold;
      margin-bottom: 5px;
    }
    
    #dialog-text {
      color: #e0e0e0;
      line-height: 1.5;
    }
    
    /* Dashboard 側邊欄 */
    #dashboard {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 280px;
      max-height: calc(100vh - 80px);
      background: rgba(20, 20, 40, 0.95);
      border: 2px solid #6a6a8a;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    
    #dashboard-header {
      padding: 10px 15px;
      background: #3a3a5a;
      color: #ffd700;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    
    #dashboard-toggle {
      font-size: 12px;
      color: #aaa;
    }
    
    #villager-list {
      max-height: 200px;
      overflow-y: auto;
      border-bottom: 1px solid #4a4a6a;
    }
    
    .villager-item {
      padding: 8px 15px;
      color: #e0e0e0;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      border-bottom: 1px solid #3a3a5a;
    }
    
    .villager-item:hover {
      background: #3a3a5a;
    }
    
    .villager-item.selected {
      background: #4a4a6a;
      color: #ffd700;
    }
    
    .villager-state {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 3px;
      background: #555;
    }
    
    .villager-state.idle { background: #666; }
    .villager-state.walking { background: #2196F3; }
    .villager-state.talking { background: #9C27B0; }
    .villager-state.eating { background: #FF9800; }
    .villager-state.working { background: #4CAF50; }
    .villager-state.resting { background: #795548; }
    
    /* 詳細資訊面板 */
    #villager-details {
      padding: 15px;
      overflow-y: auto;
      flex: 1;
    }
    
    .detail-section {
      margin-bottom: 15px;
    }
    
    .detail-title {
      color: #ffd700;
      font-size: 12px;
      margin-bottom: 8px;
      border-bottom: 1px solid #4a4a6a;
      padding-bottom: 4px;
    }
    
    .detail-row {
      display: flex;
      justify-content: space-between;
      color: #ccc;
      font-size: 12px;
      margin-bottom: 4px;
    }
    
    .detail-row .label { color: #888; }
    .detail-row .value { color: #fff; }
    
    .task-list, .memory-list, .relationship-list {
      font-size: 11px;
      color: #aaa;
    }
    
    .task-item, .memory-item, .relationship-item {
      padding: 4px 0;
      border-bottom: 1px solid #333;
    }
    
    .memory-item .memory-with {
      color: #ffd700;
    }
    
    .relationship-item {
      display: flex;
      justify-content: space-between;
    }
    
    .relationship-name { color: #fff; }
    .relationship-stats { color: #4CAF50; font-size: 10px; }
    
    /* 背包樣式 */
    .inventory-grid {
      display: flex;
      gap: 8px;
    }
    
    .inventory-slot {
      width: 50px;
      height: 50px;
      background: #3a3a5a;
      border: 2px solid #5a5a7a;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: #aaa;
    }
    
    .inventory-slot.empty {
      color: #555;
      font-size: 11px;
    }
    
    .inventory-slot.tool {
      border-color: #ffd700;
    }
    
    .inventory-slot .item-icon {
      font-size: 20px;
      line-height: 1;
    }
    
    .inventory-slot .item-quantity {
      color: #fff;
      font-size: 10px;
    }
    
    .inventory-slot .item-durability {
      color: #4CAF50;
      font-size: 9px;
    }
    
    #no-selection {
      color: #666;
      text-align: center;
      padding: 20px;
    }
    
    /* 滾動條樣式 */
    #villager-list::-webkit-scrollbar,
    #villager-details::-webkit-scrollbar {
      width: 6px;
    }
    
    #villager-list::-webkit-scrollbar-track,
    #villager-details::-webkit-scrollbar-track {
      background: #2a2a4a;
    }
    
    #villager-list::-webkit-scrollbar-thumb,
    #villager-details::-webkit-scrollbar-thumb {
      background: #6a6a8a;
      border-radius: 3px;
    }
    
    /* 右上角控制區 */
    #top-right-controls {
      position: absolute;
      top: 10px;
      right: 140px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    
    /* 縮放控制 */
    #zoom-controls {
      display: flex;
      gap: 5px;
      background: rgba(0, 0, 0, 0.7);
      padding: 5px 10px;
      border-radius: 4px;
    }
    
    .zoom-btn {
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 4px;
      background: #4a4a6a;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    
    .zoom-btn:hover {
      background: #6a6a8a;
    }
    
    .zoom-btn:active {
      background: #8a8aaa;
    }
    
    #zoom-level {
      color: #ffd700;
      font-size: 12px;
      min-width: 45px;
      text-align: center;
      line-height: 28px;
    }
    
    /* 圖表按鈕 */
    #chart-btn {
      background: rgba(0, 0, 0, 0.7);
      padding: 5px 12px;
      border-radius: 4px;
      border: none;
      color: #ffd700;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: background 0.2s;
      height: 28px;
      box-sizing: border-box;
    }
    
    #chart-btn:hover {
      background: rgba(60, 60, 100, 0.9);
    }
    
    /* 圖表彈窗 */
    #chart-modal {
      display: none;
      position: absolute;
      top: 50px;
      right: 10px;
      width: 600px;
      max-height: calc(100vh - 120px);
      background: rgba(20, 20, 40, 0.98);
      border: 2px solid #6a6a8a;
      border-radius: 8px;
      overflow: hidden;
      z-index: 200;
    }
    
    #chart-modal.show {
      display: block;
    }
    
    #chart-header {
      padding: 10px 15px;
      background: #3a3a5a;
      color: #ffd700;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    #chart-close-btn {
      background: none;
      border: none;
      color: #aaa;
      font-size: 20px;
      cursor: pointer;
      padding: 0 5px;
    }
    
    #chart-close-btn:hover {
      color: #fff;
    }
    
    #chart-controls {
      padding: 10px 15px;
      display: flex;
      gap: 10px;
      border-bottom: 1px solid #4a4a6a;
    }
    
    #chart-controls select {
      background: #3a3a5a;
      border: 1px solid #5a5a7a;
      border-radius: 4px;
      color: #fff;
      padding: 5px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    
    #chart-controls select:focus {
      outline: none;
      border-color: #ffd700;
    }
    
    #chart-container {
      padding: 15px;
      height: 350px;
    }
    
    #history-chart {
      width: 100%;
      height: 100%;
    }
    
    /* 圖表圖例 */
    .chart-legend {
      padding: 10px 15px;
      display: flex;
      justify-content: center;
      gap: 20px;
      font-size: 12px;
      color: #ccc;
    }
    
    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    
    .legend-color {
      width: 12px;
      height: 12px;
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
    
    <!-- 天氣遮罩（調暗畫面）-->
    <div id="weather-overlay"></div>
    
    <!-- 天氣特效層 -->
    <div id="weather-effects"></div>
    
    <div id="ui-layer">
      <!-- 時間與天氣顯示 -->
      <div id="time-display">
        <span id="time-text">第 1 天 08:00</span>
        <span id="weather-icon">☀️</span>
      </div>
      
      <!-- 右上角控制區 -->
      <div id="top-right-controls">
        <!-- 圖表按鈕 -->
        <button id="chart-btn">📊 統計</button>
        
        <!-- 縮放控制 -->
        <div id="zoom-controls">
          <button class="zoom-btn" id="zoom-out-btn">−</button>
          <span id="zoom-level">100%</span>
          <button class="zoom-btn" id="zoom-in-btn">+</button>
        </div>
      </div>
      
      <!-- 圖表彈窗 -->
      <div id="chart-modal">
        <div id="chart-header">
          <span>📊 歷史統計</span>
          <button id="chart-close-btn">×</button>
        </div>
        <div id="chart-controls">
          <select id="chart-target">
            <option value="all">全體平均</option>
          </select>
          <select id="chart-range">
            <option value="24">最近 1 天</option>
            <option value="168">最近 7 天</option>
            <option value="0">全部</option>
          </select>
        </div>
        <div id="chart-container">
          <canvas id="history-chart"></canvas>
        </div>
        <div class="chart-legend">
          <div class="legend-item">
            <div class="legend-color" style="background: #4CAF50;"></div>
            <span>體力</span>
          </div>
          <div class="legend-item">
            <div class="legend-color" style="background: #FF9800;"></div>
            <span>飢餓</span>
          </div>
          <div class="legend-item">
            <div class="legend-color" style="background: #2196F3;"></div>
            <span>社交</span>
          </div>
          <div class="legend-item">
            <div class="legend-color" style="background: #ffd700;"></div>
            <span>總金錢</span>
          </div>
        </div>
      </div>
      
      <!-- Dashboard 側邊欄 -->
      <div id="dashboard">
        <div id="dashboard-header">
          <span>🏘️ 村民列表</span>
          <span id="dashboard-toggle">▼</span>
        </div>
        <div id="villager-list">
          <!-- 村民列表會動態生成 -->
        </div>
        <div id="villager-details">
          <div id="no-selection">點擊村民查看詳情</div>
        </div>
      </div>
      
      <!-- 狀態列 -->
      <div id="status-bar">
        <div id="villager-name" style="color: #ffd700; font-weight: bold; margin-right: 10px;">點擊村民觀察</div>
        <div class="stat-item">
          <span>體力</span>
          <div class="stat-bar">
            <div class="stat-fill energy" style="width: 0%"></div>
          </div>
          <span class="stat-value" id="energy-value">0%</span>
        </div>
        <div class="stat-item">
          <span>飢餓</span>
          <div class="stat-bar">
            <div class="stat-fill hunger" style="width: 0%"></div>
          </div>
          <span class="stat-value" id="hunger-value">0%</span>
        </div>
        <div class="stat-item">
          <span>社交</span>
          <div class="stat-bar">
            <div class="stat-fill social" style="width: 0%"></div>
          </div>
          <span class="stat-value" id="social-value">0%</span>
        </div>
      </div>
      
      <!-- 動作選單 -->
      <div id="action-menu" class="action-menu">
        <div class="action-menu-title">選擇動作</div>
      </div>
      
      <!-- 對話框 -->
      <div id="dialog-box">
        <div id="dialog-speaker">村民</div>
        <div id="dialog-text">你好！今天天氣真好。</div>
      </div>
    </div>
  </div>
  
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <script type="module" src="src/main.js"></script>
</body>
</html>
